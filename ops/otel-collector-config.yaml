# OpenTelemetry Collector for medops, exporting to Dynatrace.
#
# Mounted read-only at /etc/otelcol/config.yaml by docker-compose.observability.yml.
# Runs in agent mode: it sits on the same compose network as medops-api, receives
# OTLP from it, and forwards to Dynatrace over the internet. Not a gateway - there
# is only one application to collect from, and a gateway mode would add a second
# hop for no benefit.
#
# Why otlp_http and not a "dynatrace" exporter: the dedicated dynatrace exporter
# was deprecated at the end of 2023 and receives no updates. Dynatrace ingests
# OTLP natively, so the generic OTLP/HTTP exporter is both current and what makes
# this portable - swapping DT_ENDPOINT for another vendor's endpoint is the whole
# point of using OpenTelemetry.
#
# NOTE: ${DT_ENDPOINT} and ${DT_API_TOKEN} are expanded by the COLLECTOR, not by
# compose, because the collector's own config parser resolves ${env:VAR}. They must
# therefore be present in the collector container's environment (they are, via
# docker-compose.observability.yml). Do not inline the token here.

receivers:
  otlp:
    protocols:
      grpc:
        # Bound to all interfaces inside the container so medops-api can reach it
        # over the compose network. The compose file publishes nothing to the
        # host, so this is not reachable from outside.
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Dynatrace's documented recommendation: batch per signal, with batch last in
  # each pipeline. Traces tolerate larger batches than metrics because metrics are
  # scraped on an interval while traces are per-request and bursty.
  batch/traces:
    send_batch_size: 5000
    send_batch_max_size: 5000
    timeout: 60s
  batch/metrics:
    send_batch_size: 3000
    send_batch_max_size: 3000
    timeout: 60s

  # Drops anything the collector cannot send, rather than blocking the pipeline
  # when Dynatrace is unreachable. Without this a Dynatrace outage fills the
  # queue and the application stalls on export - the collector would become a
  # single point of failure for the API it is supposed to be observing.
  memory_limiter:
    # 2 GB box shared with Postgres, Kafka, Redis, Grafana and Prometheus. Sized
    # well under the compose memory limit below so the limiter reacts before the
    # kernel OOM killer does.
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  # Strips high-cardinality attributes before export. Without this, span volume
  # grows with the number of distinct request paths and can dominate the bill.
  attributes/redact:
    actions:
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: enduser.id
        action: delete

exporters:
  otlp_http:
    # Dynatrace SaaS OTLP ingest endpoint, supplied at runtime.
    endpoint: ${env:DT_ENDPOINT}
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"
    # Dynatrace rate-limits aggressively; queue and retry rather than dropping.
    sending_queue:
      enabled: true
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Where traces land if Dynatrace is unreachable. Keeps a local copy instead of
  # discarding data, and makes the failure visible in the collector's own logs.
  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 500

service:
  # The collector's own health and metrics, for the Prometheus scrape. Not exposed
  # to the host; prometheus.yml targets it over the compose network if you want
  # to alert on collector health.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      # memory_limiter must be first so it can shed load before anything else
      # allocates; redacting before batching keeps batches small.
      processors: [memory_limiter, attributes/redact, batch/traces]
      exporters: [otlp_http, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch/metrics]
      exporters: [otlp_http, debug]
    # No logs pipeline on purpose. medops-api logs to stdout, where Docker already
    # collects them and the deploy workflow tails them on failure. Routing them
    # through the collector would duplicate them and cost memory for no gain.
    # Add one if you later adopt Loki.

name: Dependency security scan

# Weekly full scan: OWASP dependency-check for the Maven API plus npm and pip
# audits. Not run per-push because the first NVD vulnerability-feed download is
# slow; deploy.yml gates every push on tests + npm audit instead. Reports are
# uploaded as artifacts; the build fails on CVSS >= 7 (set in medops-api/pom.xml).
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 # v4.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: medops-ui/package-lock.json

      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.12"

      # Disabled: dependency-check 13 requires a non-empty NVD_API_KEY (the secret
      # is currently unset), and no other job covers medops-api Java dependencies.
      # Re-enable once NVD_API_KEY is provisioned, or gate this step with an
      # `if: ${{ secrets.NVD_API_KEY != '' }}` to keep coverage when the key exists.
      # - name: OWASP dependency-check (medops-api)
      #   working-directory: medops-api
      #   env:
      #     NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      #   run: bash ./mvnw -B org.owasp:dependency-check-maven:check

      - name: npm audit (medops-ui, fails on high/critical)
        working-directory: medops-ui
        run: npm audit --audit-level=high

      - name: pip-audit (medops-ai)
        working-directory: medops-ai
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements.txt

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: dependency-check-report
          path: medops-api/target/dependency-check-report/
          if-no-files-found: warn

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Shellcheck all tracked shell scripts
        run: git ls-files '*.sh' | xargs shellcheck
name: Deploy to EC2 via SSH

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: medops-ui/package-lock.json

      - name: Maven tests (medops-api)
        working-directory: medops-api
        run: bash ./mvnw -B test

      - name: npm audit (medops-ui, fails on high/critical)
        working-directory: medops-ui
        run: |
          npm ci
          npm audit --audit-level=high

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GH_TOKEN
          script: |
            set -e
            export GIT_TERMINAL_PROMPT=0
            cd /home/ec2-user/medops

            sudo chown -R ec2-user:ec2-user /home/ec2-user/medops
            sudo chmod -R 755 /home/ec2-user/medops

            # Free disk space before building (prevents "No space left on device").
            # Keeps running containers and named volumes; only reclaims unused ones.
            echo "Disk usage before cleanup:"
            df -h /
            sudo docker system prune -f || true
            sudo docker builder prune -f || true
            sudo sh -c 'find /var/lib/docker/containers -type f -name "*-json.log" -size +0 -exec truncate -s 0 {} +' || true
            echo "Disk usage after cleanup:"
            df -h /

            # origin is HTTPS, so a non-interactive fetch needs a token.
            # github.token already has contents:read for this repo (see
            # top-level permissions), passed via `envs` so it never lands in
            # the remote URL / shell history. Token is sent as an auth header,
            # never echoed.
            if [ -n "${GH_TOKEN:-}" ]; then
              AUTH_B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
              git -c "http.https://github.com/.extraHeader=AUTHORIZATION: basic $AUTH_B64" fetch --prune origin "+refs/heads/dev:refs/remotes/origin/dev"
              unset AUTH_B64
            else
              git fetch --prune origin "+refs/heads/dev:refs/remotes/origin/dev"
            fi
            git reset --hard origin/dev

            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

name: Deploy MedOps to AWS EC2

on:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY || secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT != '' && secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd /home/ec2-user/medops
            export DEPLOY_BRANCH="${{ github.ref_name }}"
            bash deploy/ec2-deploy.sh

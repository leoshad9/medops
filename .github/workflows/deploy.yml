name: Deploy to EC2 via SSH

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: medops-ui/package-lock.json

      - name: Maven tests (medops-api)
        working-directory: medops-api
        run: bash ./mvnw -B test

      # TODO: re-enable after npm registry maintenance window (Sep 19, 17:00-19:00 UTC) ends.
      # Temporarily disabled because the npm audit endpoint returns 503 during maintenance.
      # - name: npm audit (medops-ui, fails on high/critical)
      #   working-directory: medops-ui
      #   run: |
      #     npm ci
      #     npm audit --audit-level=high

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ec2-user/medops

            sudo chown -R ec2-user:ec2-user /home/ec2-user/medops
            sudo chmod -R 755 /home/ec2-user/medops

            # Free disk space before building (prevents "No space left on device").
            # Keeps running containers and named volumes; only reclaims unused ones.
            echo "Disk usage before cleanup:"
            df -h /
            sudo docker system prune -f || true
            sudo docker builder prune -f || true
            sudo sh -c 'find /var/lib/docker/containers -type f -name "*-json.log" -size +0 -exec truncate -s 0 {} +' || true
            echo "Disk usage after cleanup:"
            df -h /

            git fetch origin
            git reset --hard origin/dev

            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

name: Deploy to EC2 via SSH

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: medops-ui/package-lock.json

      - name: Maven tests (medops-api)
        working-directory: medops-api
        run: bash ./mvnw -B test

      - name: npm audit (medops-ui, fails on high/critical)
        working-directory: medops-ui
        run: npm audit --audit-level=high

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ec2-user/medops

            sudo chown -R ec2-user:ec2-user /home/ec2-user/medops
            sudo chmod -R 755 /home/ec2-user/medops

            git fetch origin
            git reset --hard origin/dev

            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

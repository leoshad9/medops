name: Deploy to EC2 via SSH

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # sql-maven-plugin provisions medops_test on a real Postgres. The tests used
    # to embed one, but nothing here started a server, so `mvn verify` needs this.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@2dfa2011c5b2a0f1489bf9e433881c92c1631f88 # v4.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: medops-ui/package-lock.json

      - name: Maven verify (medops-api, includes *IT integration tests)
        working-directory: medops-api
        run: bash ./mvnw -B verify

      - name: npm audit (medops-ui, fails on high/critical)
        working-directory: medops-ui
        run: |
          npm ci
          npm audit --audit-level=high

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GH_TOKEN
          script: |
            set -e
            export GIT_TERMINAL_PROMPT=0
            cd /home/ec2-user/medops

            sudo chown -R ec2-user:ec2-user /home/ec2-user/medops
            sudo chmod -R 755 /home/ec2-user/medops

            # Free disk space before building (prevents "No space left on device").
            # Keeps running containers and named volumes; only reclaims unused ones.
            echo "Disk usage before cleanup:"
            df -h /
            sudo docker system prune -f || true
            sudo docker builder prune -f || true
            sudo sh -c 'find /var/lib/docker/containers -type f -name "*-json.log" -size +0 -exec truncate -s 0 {} +' || true
            echo "Disk usage after cleanup:"
            df -h /

            # origin is HTTPS, so a non-interactive fetch needs a token.
            # github.token already has contents:read for this repo (see
            # top-level permissions), passed via `envs` so it never lands in
            # the remote URL / shell history. Token is sent as an auth header,
            # never echoed.
            if [ -n "${GH_TOKEN:-}" ]; then
              AUTH_B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
              git -c "http.https://github.com/.extraHeader=AUTHORIZATION: basic $AUTH_B64" fetch --prune origin "+refs/heads/dev:refs/remotes/origin/dev"
              unset AUTH_B64
            else
              git fetch --prune origin "+refs/heads/dev:refs/remotes/origin/dev"
            fi
            git reset --hard origin/dev

            # `up -d` detaches, so a container's own stdout never reaches this log.
            # A service that crash-loops on startup surfaces only as
            # "dependency failed to start: ... is unhealthy", which names the
            # symptom and hides the exception; `set -e` would then abort before
            # the ps below, so the diagnostics have to run inside the failure
            # branch.
            if ! sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build; then
              echo "::group::compose ps -a"
              sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -a || true
              echo "::endgroup::"

              # Exit code 137 with oom=true means the kernel killed the process
              # (2 GB t4g.small shared with Kafka's heap); exit 1 means the app
              # failed during context refresh and the stack trace is in the logs.
              echo "::group::container state"
              sudo docker inspect --format '{{.Name}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' $(sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -aq) || true
              echo "::endgroup::"

              for svc in medops-api medops-ui medops-ai postgres redis kafka; do
                echo "::group::logs $svc"
                sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=200 --no-color "$svc" || true
                echo "::endgroup::"
              done
              exit 1
            fi

            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

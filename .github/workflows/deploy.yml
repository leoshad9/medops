name: Deploy MedOps to AWS EC2

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    name: SSM deploy
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_REGION:-}" || -z "${EC2_INSTANCE_ID:-}" ]]; then
            echo "Set AWS_REGION and EC2_INSTANCE_ID as Actions secrets or variables."
            exit 1
          fi

          SCRIPT=$(cat <<EOF
          cd /home/ssm-user/medops
          export DEPLOY_BRANCH=${DEPLOY_BRANCH}
          bash deploy/ec2-deploy.sh
          EOF
          )
          B64=$(printf '%s' "$SCRIPT" | base64 -w0)
          PARAMS=$(jq -n --arg c "echo ${B64} | base64 -d | sudo -u ssm-user -H bash -s" '{commands:[$c]}')

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 2700 \
            --parameters "$PARAMS" \
            --query Command.CommandId \
            --output text)"
          echo "SSM command: $COMMAND_ID"

          for _ in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)"
            echo "status=$STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Undeliverable)
                break
                ;;
              *)
                sleep 20
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          test "$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status \
            --output text)" = "Success"

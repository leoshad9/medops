# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow helps you trigger a SonarQube analysis of your code and populates
# GitHub Code Scanning alerts with the vulnerabilities found.
# (this feature is available starting from SonarQube 9.7, Developer Edition and above)

# 1. Make sure you add a valid GitHub configuration to your SonarQube (Administration > DevOps platforms > GitHub)

# 2. Import your project on SonarQube
#     * Add your repository as a new project by clicking "Create project" from your homepage.
#
# 3. Select GitHub Actions as your CI and follow the tutorial
#     * a. Generate a new token and add it to your GitHub repository's secrets using the name SONAR_TOKEN
#          (On SonarQube, click on your avatar on top-right > My account > Security or ask your administrator)
#
#     * b. Copy/paste your SonarQube host URL to your GitHub repository's secrets using the name SONAR_HOST_URL
#
#     * c. Copy/paste the project Key into the args parameter below
#          (You'll find this information in SonarQube by following the tutorial or by clicking on Project Information at the top-right of your project's homepage)

# Feel free to take a look at our documentation (https://docs.sonarqube.org/latest/analysis/github-integration/)
# or reach out to our community forum if you need some help (https://community.sonarsource.com/c/sq/10)

name: SonarQube analysis

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarQube to decorate PRs with analysis results

jobs:
  Analysis:
    runs-on: ubuntu-latest

    # sql-maven-plugin provisions medops_test on a real Postgres. The tests used
    # to embed one, but nothing here started a server, so `mvn verify` needs this.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      # Sonar cannot compute Java coverage without compiled classes and a
      # JaCoCo report, and the scanner reads neither from git. Both steps below
      # were missing, which is why coverage had been reported as zero rather
      # than as absent.
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Same gate as deploy.yml so Sonar measures what the deploy gate tests.
      # This also produces target/classes and target/site/jacoco, which the
      # scanner args below point at.
      - name: Maven verify (medops-api, produces JaCoCo report)
        working-directory: medops-api
        run: bash ./mvnw -B verify

      - name: Analyze with SonarQube

        # You can pin the exact commit or the version.
        # uses: SonarSource/sonarqube-scan-action@v1.1.0
        uses: SonarSource/sonarqube-scan-action@7295e71c9583053f5bf40e9d4068a0c974603ec8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Generate token on SonarQube, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # add the URL of your instance to the secrets of this repo with the name SONAR_HOST_URL (Settings > Secrets > Actions > add new repository secret)
        with:
          # Additional arguments for the SonarQube scanner.
          args: |
            -Dsonar.projectKey=medops
            -Dsonar.sources=medops-api/src/main/java,medops-ai/app,medops-ui/src
            -Dsonar.projectBaseDir=.
            -Dsonar.tests=medops-api/src/test/java,medops-ai/tests,medops-ui/src/test
            # Required for coverage: the scanner runs from the repository root,
            # so it cannot infer either path the way sonar-maven-plugin would.
            # The property is sonar.coverage.jacoco.xmlReportPaths, and it takes
            # the XML file itself, not the directory holding it. There is no
            # sonar.coverageReportLocation; Sonar ignores an unknown property
            # and reports coverage as absent, which is the symptom this is
            # meant to fix. The corpus in ups_pom.txt used the deprecated
            # binary-format sonar.jacoco.reportPath plus a separate
            # sonar.jacoco.itReportPath; both are superseded.
            -Dsonar.java.binaries=medops-api/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=medops-api/target/site/jacoco/jacoco.xml
            # Without this Sonar imports the coverage above but reports zero
            # tests, because it cannot link JUnit results to source files. Both
            # directories are listed: surefire ran the 59 unit classes and
            # failsafe ran the two *IT classes, and both emit the same XML
            # format. Note the singular reportPaths; the plural
            # sonar.junit.reportsPath is the deprecated form.
            -Dsonar.junit.reportPaths=medops-api/target/surefire-reports,medops-api/target/failsafe-reports
            # Kept separate from sonar.exclusions on purpose. This list is
            # untestable code, excluded from the coverage denominator only:
            # records and entities with no behaviour, configuration, generated
            # OpenAPI, and the application entrypoint. Excluding these from
            # sonar.exclusions as well would hide real smells in them.
            -Dsonar.coverage.exclusions=medops-api/src/main/java/com/medops/**/api/dto/**,medops-api/src/main/java/com/medops/**/domain/**,medops-api/src/main/java/com/medops/**/infrastructure/persistence/**,medops-api/src/main/java/com/medops/**/config/**,medops-api/src/main/java/com/medops/MedopsApiApplication.java,medops-ai/app/schemas/**,medops-ui/src/**/*.d.ts
            # -Dsonar.verbose=true

# separate terms of service, privacy policy, and support
# documentation.

# This workflow file requires a free account on Semgrep.dev to
# manage rules, file ignores, notifications, and more.
#
# See https://semgrep.dev/docs

name: Semgrep

on:
  push:
    branches: [ "dev" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "dev" ]
  schedule:
    - cron: '40 19 * * 5'

permissions:
  contents: read

jobs:
  semgrep:

    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout project source
      - uses: actions/checkout@a5ac7e51b41094f92402da3b24376905380afc29 # v4.1.6

      # Scan code using the Semgrep CLI, pinned.
      #
      # The previous semgrep/semgrep-action@v1 step ran the deprecated
      # returntocorp/semgrep-agent:v1 image, which bundles semgrep 1.36.0. That
      # version predates MEDIUM severity support, so it aborted while loading the
      # current rules with "invalid rule severity value: MEDIUM", never wrote
      # semgrep.sarif, and failed the job on its own crash rather than on findings.
      - name: Run Semgrep
        run: |
          python -m pip install --disable-pip-version-check "semgrep==1.179.0"
          semgrep scan --config p/default --sarif --output semgrep.sarif
        env:
          SEMGREP_SEND_METRICS: "off"

      # Upload SARIF file generated by Semgrep if available.
      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@3f3e1c1e1c1e1c1e1c1e1c1e1c1e1c1e1c1e1c1e # v4.0.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

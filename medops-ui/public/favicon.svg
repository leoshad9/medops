<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MedOps">
  <!-- Full-bleed background + centered mark keeps the icon maskable-safe (logo
       from MedOpsLogo.tsx: heart with an ECG cutout, scaled to ~55% of canvas). -->
  <rect width="512" height="512" fill="#1e4a5e" />
  <g transform="translate(256 256) scale(1.9) translate(-87 -85.5)">
    <mask id="ecg-cutout">
      <path
        d="M72 139 C64 131 24 101 15 72 C5 42 23 18 50 18 C66 18 78 27 87 39 C96 27 108 18 124 18 C151 18 169 42 159 72 C150 101 110 131 102 139 L87 153 Z"
        fill="#ffffff"
      />
      <path
        d="M28 78 H54 L66 61 L80 94 L94 48 L108 78 H139"
        fill="none"
        stroke="#000000"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>
    <path
      d="M72 139 C64 131 24 101 15 72 C5 42 23 18 50 18 C66 18 78 27 87 39 C96 27 108 18 124 18 C151 18 169 42 159 72 C150 101 110 131 102 139 L87 153 Z"
      fill="#f5f7fa"
      mask="url(#ecg-cutout)"
    />
  </g>
</svg>

# Included from the image's http {} block (not sites-available).
# Tier 1: per-IP cap so floods never reach Spring. Redis still owns per-email lockout.
limit_req_zone $binary_remote_addr zone=api_ip_limit:10m rate=10r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
limit_conn_status 429;
server_tokens off;

# Wire-size win: the SPA ships as one ~850 kB JS chunk; gzip brings it to ~247 kB
# (Vite's own build report), CSS/JSON/SVG shrink similarly. Kept at http level so
# both static files and proxied API responses are compressed.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain
           text/css
           text/xml
           application/json
           application/javascript
           text/javascript
           application/manifest+json
           application/xml
           image/svg+xml;

# Cache policy by path. Fingerprinted /assets/* files are immutable for a year;
# SPA documents must revalidate so a deploy's new hashed assets load; /api and
# /actuator are excluded (empty value = header omitted) so this never duplicates
# Spring's own Cache-Control on proxied responses.
map $uri $cache_control {
    default        "no-cache";
    "~^/assets/"   "public, max-age=31536000, immutable";
    "~^/icons/"    "public, max-age=86400";
    "~^/api/"      "";
    "~^/actuator/" "";
}

# Upstream pool with keepalive: reuses TCP connections to Spring instead of a fresh
# connect per /api request (the dominant cost on tiny endpoints like GET /api/auth/csrf).
# Requires proxy_http_version 1.1 + `proxy_set_header Connection ""` in the locations below.
upstream medops_api_upstream {
    server medops-api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name medops.duckdns.org;
    limit_conn perip_conn 32;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        limit_req zone=api_ip_limit burst=20 nodelay;
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name medops.duckdns.org;
    limit_conn perip_conn 32;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://www.google-analytics.com https://www.google.co.in; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Declared alongside the security headers above so this location-level
    # add_header does not suppress them (add_header is not additive across levels).
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api_ip_limit burst=20 nodelay;
        proxy_pass http://medops_api_upstream/api/;
        proxy_http_version 1.1;
        # Keepalive to the upstream avoids a fresh TCP (+ TLS-terminated-at-edge,
        # still TCP+accept) handshake per /api call. Without the pool below, the
        # 398 ms TTFB-class latency on tiny endpoints like GET /api/auth/csrf is
        # dominated by connection setup rather than Spring handler time.
        # Monitor with $upstream_response_time / $upstream_connect_time in the
        # access log: connect_time >> 0 means the pool is bypassed; response_time
        # >> connect_time means Spring (filters/DB), not the proxy, is slow.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 60s;
    }

    location /actuator/health {
        proxy_pass http://medops_api_upstream/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /actuator/health/ {
        proxy_pass http://medops_api_upstream/actuator/health/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /actuator/ {
        return 404;
    }
}

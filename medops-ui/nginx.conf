# Included from the image's http {} block (not sites-available).
# Tier 1: per-IP cap so floods never reach Spring. Redis still owns per-email lockout.
limit_req_zone $binary_remote_addr zone=api_ip_limit:10m rate=10r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
limit_conn_status 429;
server_tokens off;

server {
    listen 8080;
    server_name medops.duckdns.org;
    limit_conn perip_conn 32;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        limit_req zone=api_ip_limit burst=20 nodelay;
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name medops.duckdns.org;
    limit_conn perip_conn 32;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://www.google-analytics.com https://www.google.co.in; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api_ip_limit burst=20 nodelay;
        proxy_pass http://medops-api:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 60s;
    }

    location /actuator/health {
        proxy_pass http://medops-api:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /actuator/health/ {
        proxy_pass http://medops-api:8080/actuator/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        return 404;
    }
}

# ============================================================
# MedOps API - single config file (local defaults + test profile)
# Redis/Kafka: docker compose up -d (ports 6379 / 9092)
# Disable without brokers: MEDOPS_REDIS_ENABLED=false MEDOPS_MESSAGING_ENABLED=false
# ============================================================

spring:
  application:
    name: medops-api

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/medops}"
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        "[format_sql]": true
        "[hbm2ddl.create_namespaces]": true

  flyway:
    # Local dev runs the same migrations prod does (db/migration/V*.sql) so a
    # migration that only works on a hibernate-created schema fails here instead of
    # at prod startup, where ddl-auto is validate. baseline-on-migrate matches
    # application-prod.yml: a dev database that predates Flyway gets baselined at V1
    # and then picks up the newer migrations rather than refusing to start.
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            # Never silently fall back to cleartext SMTP: fail fast instead.
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    from: ${MAIL_FROM:MedOps <noreply@medops.dev>}

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:9092}"
    consumer:
      group-id: medops-api-reports
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.medops.messaging
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Must be >= spring.servlet.multipart.max-request-size (default form/swallow caps are lower).
    max-http-form-post-size: 8MB
    max-swallow-size: 8MB

springdoc:
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    kafka:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:28800000}
  issuer: "${JWT_ISSUER:medops-api}"
  audience: "${JWT_AUDIENCE:medops-web}"

resilience4j:
  timelimiter:
    instances:
      reportSummarizer:
        timeout-duration: 20s
  circuitbreaker:
    instances:
      reportSummarizer:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      smtpMail:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      reportSummarizer:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
      smtpMail:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.mail.MailException
          - jakarta.mail.MessagingException
          # The service wraps both of the above in EmailSendingException; without this
          # entry the @Retry(smtpMail) annotations never trigger.
          - com.medops.auth.infrastructure.email.EmailSendingException

medops:
  security:
    open-registration: true
    api-docs-public: true
    # CIDR ranges from which X-Forwarded-For / X-Real-IP headers are honored.
    # Local dev trusts loopback; production should list the load-balancer / ingress CIDRs.
    trusted-proxy-cidrs:
      - "127.0.0.1/8"
      - "0:0:0:0:0:0:0:1/128"
      - "::1/128"
  appointments:
    zone: Asia/Kolkata
    slot-minutes: 30
    open: "09:00"
    close: "17:00"
  files:
    root: ${MEDOPS_FILES_ROOT:./data/clinical-files}
  redis:
    enabled: ${MEDOPS_REDIS_ENABLED:true}
  idempotency:
    ttl: PT24H
  messaging:
    enabled: ${MEDOPS_MESSAGING_ENABLED:true}
    appointments-topic: medops.appointments
    reports-topic: medops.reports
  ai:
    # When true, Spring calls medops-ai (FastAPI). Provider keys live only in that service.
    service-enabled: ${MEDOPS_AI_ENABLED:true}
    service-base-url: "${MEDOPS_AI_BASE_URL:http://localhost:8000}"
    summary-cache-ttl: PT24H
    doctor-list-cache-ttl: PT1M

password-reset:
  otp:
    ttl: 10m
    max-attempts: 5
    length: 6
    # HMAC secret for hashing OTPs at rest in Redis; must come from the environment.
    # Empty default + @NotBlank => fails fast at startup if not configured.
    # Matches docker-compose.prod.yml's PASSWORD_RESET_OTP_HMAC_SECRET passthrough.
    hmac-secret: ${PASSWORD_RESET_OTP_HMAC_SECRET:}
  reset-token:
    ttl: 15m
  resend:
    cooldown: 60s
  rate-limit:
    forgot-per-email-per-hour: 3
    forgot-per-ip-per-minute: 10

logging:
  level:
    root: "${LOG_LEVEL_ROOT:INFO}"
    "[com.medops]": "${LOG_LEVEL_APP:INFO}"
    "org.springframework.security": DEBUG
    "org.springframework.security.web.csrf": TRACE

---
# SpringBootTest / @ActiveProfiles("test")
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

password-reset:
  otp:
    ttl: 60s
    max-attempts: 5
    length: 6
    hmac-secret: test-hmac-secret-for-unit-tests-only
  reset-token:
    ttl: 15m
  resend:
    cooldown: 60s
  rate-limit:
    forgot-per-email-per-hour: 3
    forgot-per-ip-per-minute: 10

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1tZWRvcHMtdGVzdGluZy1vbmx5LTMyYnl0ZQ==
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 28800000
  issuer: "medops-api"
  audience: "medops-web"

medops:
  security:
    open-registration: true
    api-docs-public: false
    trusted-proxy-cidrs:
      - "127.0.0.1/8"
      - "::1/128"
  redis:
    enabled: false
  messaging:
    enabled: false
  ai:
    service-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

# ============================================================
# MedOps API - Application Configuration
# ============================================================

spring:
  application:
    name: medops-api

  # --- Database ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medops}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update        # Hibernate manages schema directly (no Flyway)
    properties:
      hibernate:
        "[format_sql]": true   # Pretty-print SQL in logs
        "[hbm2ddl.create_namespaces]": true  # Create a capability's schema (e.g. "patients") before its tables

  # --- Flyway Migrations ---
  flyway:
    enabled: false

# --- Server ---
server:
  port: ${SERVER_PORT:8080}

# --- API Documentation ---
springdoc:
  api-docs:
    path: /api-docs

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # Liveness & readiness probes for Kubernetes

# --- JWT ---
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}       # 15 minutes
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 days

# --- Logging ---
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    "[com.medops]": ${LOG_LEVEL_APP:INFO}
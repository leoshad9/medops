# ============================================================
# Production profile — SPRING_PROFILES_ACTIVE=prod
# Secrets from environment only (/opt/medops/.env via Compose).
# ============================================================

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        "[format_sql]": false

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}

server:
  port: ${SERVER_PORT:8080}
  # Nginx sits in front; use X-Forwarded-* so rate limits key on the real client IP.
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true
    kafka:
      enabled: true

medops:
  security:
    open-registration: false
    api-docs-public: false
  files:
    root: ${MEDOPS_FILES_ROOT:/data/clinical-files}
  redis:
    enabled: ${MEDOPS_REDIS_ENABLED:true}
  messaging:
    enabled: ${MEDOPS_MESSAGING_ENABLED:true}
  ai:
    service-enabled: ${MEDOPS_AI_ENABLED:true}
    service-base-url: ${MEDOPS_AI_BASE_URL:http://medops-ai:8000}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    "[com.medops]": ${LOG_LEVEL_APP:INFO}
    "[org.hibernate.SQL]": WARN
